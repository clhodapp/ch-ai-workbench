# SPDX-License-Identifier: MIT
[package]
name = "agent-bus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Coordination bus for agent sessions across harnesses: daemon, MCP server and CLI"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }
ulid = "3.0.0"

[profile.release]
lto = true
codegen-units = 1
