# SPDX-License-Identifier: MIT
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-consent"
version = "0.1.0"
description = "Prompt API for Claude Code hooks: raise a question for the user through a spool, answer it from any attached handler"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
claude-consent = "claude_consent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
